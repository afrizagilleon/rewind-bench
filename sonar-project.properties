sonar.projectKey=afrizagilleon_rewind-bench
sonar.organization=afrizagilleon

# What this project actually is: a small TypeScript harness in src/ and test/,
# plus a large amount of recorded output. The output is committed on purpose —
# it is the evidence, and every published figure can be recomputed from it
# without an API key. But it is generated data, not source, and analysing it
# measures nothing useful.
sonar.sources=src,scripts
sonar.tests=test

# 489 files, 10 MB. Run transcripts and JSONL ledgers share a fixed schema, so
# a duplication detector reads them as one enormous repetition. results/report.html
# is emitted by src/report.ts, and docs/index.html is a byte-identical published
# copy of it — two generated files that duplicate each other by definition.
sonar.exclusions=results/**,docs/**,fixtures/**,node_modules/**

# Recorded API responses, kept so the client can be tested without a live server.
sonar.coverage.exclusions=test/**,fixtures/**

sonar.sourceEncoding=UTF-8
